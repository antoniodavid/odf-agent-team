name: ODF Installer Scenarios
type: installer
tests:
  - name: dry-run shows plan without modifying
    input:
      args: ['--dry-run']
      env: {}
    expected:
      exit_code: 0
      stdout_contains:
        - 'Dry-run complete'
        - 'Target directory:'
        - 'Would install ODF files'

  - name: non-interactive install copies files to temp HOME
    input:
      args: ['--yes', '--force']
      env:
        ODF_SKIP_NPM: '1'
        ODF_SKIP_SELFTEST: '1'
    expected:
      exit_code: 0
      stdout_contains:
        - 'ODF Agent Team v1.2.1 — installed'
        - 'Skills:'
        - 'Agents:'
      files_exist:
        - .config/opencode/odf-registry.json
        - .config/opencode/plugins/odf-delegation.ts
        - .config/opencode/scripts/odf-test-runner.js
        - .config/opencode/scripts/odf-metrics.js
        - .config/opencode/scripts/odf-evaluation.js
        - .config/opencode/scripts/odf-evaluation.d.ts
        - .config/opencode/scripts/odf-engram-maintenance.js
        - .config/opencode/scripts/odf-engram-maintenance.d.ts
        - .config/opencode/scripts/fixtures
        - .config/opencode/command/odf-new.md
        - .config/opencode/command/odf-health.md

  - name: re-run is idempotent and creates a new backup
    input:
      runs: 2
      args: ['--yes', '--force']
      env:
        ODF_SKIP_NPM: '1'
        ODF_SKIP_SELFTEST: '1'
    expected:
      exit_code: 0
      stdout_contains:
        - 'ODF Agent Team v1.2.1 — installed'
      files_exist:
        - .config/opencode/odf-registry.json
      backup_count: 1

  - name: rewrites author config paths to the installed environment
    input:
      args: ['--yes', '--force']
      env:
        ODF_SKIP_NPM: '1'
        ODF_SKIP_SELFTEST: '1'
    expected:
      exit_code: 0
      stdout_contains:
        - 'ODF Agent Team v1.2.1 — installed'
      files_exist:
        - .config/opencode/skills/odf-init/SKILL.md
      files_not_contain:
        - path: .config/opencode/skills/odf-init/SKILL.md
          text: '/home/adruban'

  - name: reports environment dependency probes after install
    input:
      args: ['--yes', '--force']
      env:
        ODF_SKIP_NPM: '1'
        ODF_SKIP_SELFTEST: '1'
    expected:
      exit_code: 0
      stdout_contains:
        - 'Environment dependencies:'
        - 'node'

  - name: configure-mcp merges context7 and backs up opencode.json
    input:
      args: ['--yes', '--force', '--configure-mcp']
      env:
        ODF_SKIP_NPM: '1'
        ODF_SKIP_SELFTEST: '1'
    expected:
      exit_code: 0
      stdout_contains:
        - 'context7 MCP entry merged'
      files_exist:
        - .config/opencode/opencode.json
