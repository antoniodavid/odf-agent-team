name: odf-orchestrator-state-machine
type: orchestrator
agent: odoo_orchestrator
tests:
  - name: "next phase is preflight when preflight incomplete"
    input:
      state:
        change: "my-feature"
        phase: "init"
    expected:
      next_phase: "preflight"

  - name: "next phase is propose after preflight"
    input:
      state:
        change: "my-feature"
        phase: "preflight"
        preflight:
          change: "my-feature"
          execution_mode: "interactive"
          artifact_store: "openspec"
          delivery_strategy: "ask-on-risk"
          review_budget_lines: 400
          odoo_version: 18
          tdd_mode: false
          solution_strategy: "custom"
          chain_strategy: "feature-branch"
          persisted_at: "2026-06-18T00:00:00Z"
    expected:
      next_phase: "propose"

  - name: "next phase is assess after propose"
    input:
      state:
        change: "my-feature"
        phase: "propose"
        preflight:
          change: "my-feature"
          execution_mode: "interactive"
          artifact_store: "openspec"
          delivery_strategy: "ask-on-risk"
          review_budget_lines: 400
          odoo_version: 18
          tdd_mode: false
          solution_strategy: "custom"
          chain_strategy: "feature-branch"
          persisted_at: "2026-06-18T00:00:00Z"
        artifacts:
          propose: true
          assess: false
          design: false
    expected:
      next_phase: "assess"

  - name: "next phase is design after assess"
    input:
      state:
        change: "my-feature"
        phase: "assess"
        preflight:
          change: "my-feature"
          execution_mode: "interactive"
          artifact_store: "openspec"
          delivery_strategy: "ask-on-risk"
          review_budget_lines: 400
          odoo_version: 18
          tdd_mode: false
          solution_strategy: "custom"
          chain_strategy: "feature-branch"
          persisted_at: "2026-06-18T00:00:00Z"
        artifacts:
          propose: true
          assess: true
          design: false
    expected:
      next_phase: "design"

  - name: "resume selects latest active change"
    input:
      states:
        - change: "older"
          state:
            change: "older"
            phase: "assess"
            last_updated: "2026-06-18T00:00:00Z"
            preflight:
              change: "older"
              execution_mode: "interactive"
              artifact_store: "openspec"
              delivery_strategy: "ask-on-risk"
              review_budget_lines: 400
              odoo_version: 18
              tdd_mode: false
              solution_strategy: "custom"
              chain_strategy: "feature-branch"
              persisted_at: "2026-06-18T00:00:00Z"
        - change: "newer"
          state:
            change: "newer"
            phase: "design"
            last_updated: "2026-06-18T01:00:00Z"
            preflight:
              change: "newer"
              execution_mode: "interactive"
              artifact_store: "openspec"
              delivery_strategy: "ask-on-risk"
              review_budget_lines: 400
              odoo_version: 18
              tdd_mode: false
              solution_strategy: "custom"
              chain_strategy: "feature-branch"
              persisted_at: "2026-06-18T00:00:00Z"
    expected:
      resume_change: "newer"

  - name: "resume specific change by name"
    input:
      states:
        - change: "alpha"
          state:
            change: "alpha"
            phase: "assess"
            last_updated: "2026-06-18T00:00:00Z"
            preflight:
              change: "alpha"
              execution_mode: "interactive"
              artifact_store: "openspec"
              delivery_strategy: "ask-on-risk"
              review_budget_lines: 400
              odoo_version: 18
              tdd_mode: false
              solution_strategy: "custom"
              chain_strategy: "feature-branch"
              persisted_at: "2026-06-18T00:00:00Z"
        - change: "beta"
          state:
            change: "beta"
            phase: "design"
            last_updated: "2026-06-18T02:00:00Z"
            preflight:
              change: "beta"
              execution_mode: "interactive"
              artifact_store: "openspec"
              delivery_strategy: "ask-on-risk"
              review_budget_lines: 400
              odoo_version: 18
              tdd_mode: false
              solution_strategy: "custom"
              chain_strategy: "feature-branch"
              persisted_at: "2026-06-18T00:00:00Z"
      name: "alpha"
    expected:
      resume_change: "alpha"

  - name: "odf-new health is first and failed health has no later side effects"
    input:
      health_gate_contract_only: true
    expected:
      prompt_section: |
        ### ODF Entry Health Gate

        - For every exact `/odf-new ...` invocation, `odf_health` MUST be the first ODF operation. Call it before `question`, Engram writes, artifact/state creation, route/triage/status tools, or delegation.
        - Continue only when `odf_health` returns `status: warning` with the required static/runtime checks present, or a future `status: ok`. A missing tool, thrown/malformed result, `failed`, or `blocked` result stops the command immediately with no subsequent question, write, artifact creation, or delegation.
        - Never simulate health from file reads and never bypass this gate because project configuration or prior session health exists. The runtime hook also enforces this order for `/odf-new` sessions.

  - name: "prompt-only continuation contract (not a routing or turn replay)"
    input:
      prompt_contract_only: true
    expected:
      prompt_section: |
        ### Continuation Intent

        - `/odf-continue [name]` activates standalone ODF workflow continuation. A clear `continue existing` answer to the duplicate-change question inside an active `/odf-new` invocation is scoped authorization to continue that named change directly; do not require the user to repeat `/odf-continue`.
        - Conversational messages such as `continue`, `continúa`, `dale`, or equivalents MUST NOT be reinterpreted as standalone `/odf-continue` outside an explicit pending ODF question.
        - After an abort or interruption, such a message resumes the pending user request from the context already obtained; it does not start ODF state discovery.
        - For one user intent, run discovery or state lookup at most once while its results remain stable. If the result is sufficient or unchanged, synthesize the response or stop. Never repeat the same tool and arguments in a later turn for that intent.
