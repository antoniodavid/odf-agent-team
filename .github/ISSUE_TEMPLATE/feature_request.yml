name: Feature request
description: Propose a new capability or a change to an existing ODF workflow.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is painful or missing today?
      placeholder: There is no harness mechanism to report issues without a GitHub YAML form.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should ODF do instead?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you evaluated and why they lost.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - agents
        - skills
        - plugin
        - commands
        - installer
        - tests
        - docs
        - other
    validations:
      required: true
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to help implement this.
          required: false
